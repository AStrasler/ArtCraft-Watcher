name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint Edge Function
        run: deno lint supabase/functions/crawl-artcraft

      - name: Test Edge Function
        run: deno test --allow-read supabase/functions/crawl-artcraft

      - name: Type-check Edge Function
        run: deno check supabase/functions/crawl-artcraft/index.ts

      - name: Validate migration filenames
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            [[ "$file" =~ ^[0-9]{14}_.+\.sql$ ]]
          done
          versions="$(printf '%s\n' "${files[@]}" | cut -c1-14)"
          test "$(printf '%s\n' "$versions" | sort -u | wc -l)" -eq "${#files[@]}"

      - name: Reject deployment-specific Supabase project IDs
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'project_id[[:space:]]*=' supabase README.md SECURITY.md; then
            echo "Deployment-specific Supabase project_id must not be committed."
            exit 1
          fi

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: watcher_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Execute disposable PostgreSQL integration tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d watcher_test -X -v ON_ERROR_STOP=1 -f tests/sql/hardening.sql
